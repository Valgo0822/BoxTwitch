name: Compiler BoxTwitch
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
        working-directory: BoxTwitch
      - uses: actions/upload-artifact@v4
        with:
          name: BoxTwitch-jar
          path: BoxTwitch/build/libs/BoxTwitch-fabric-1.21.11.jar
